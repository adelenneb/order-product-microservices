spring.application.name=order-service
order.message=Order service config from native repo

server.port=${SERVER_PORT:8082}
management.endpoints.web.exposure.include=health,info
eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}

# DataSource (in-memory for dev/demo)
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Feign timeouts & circuit breaker
feign.client.config.default.connect-timeout=2000
feign.client.config.default.read-timeout=3000
feign.circuitbreaker.enabled=true
