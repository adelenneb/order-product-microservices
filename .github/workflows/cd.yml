name: docker-build-and-push app

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    concurrency:
      group: cd-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      REGISTRY: docker.io
      IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        if: ${{ env.IMAGE_NAMESPACE != '' }}
        run: |
          set -euo pipefail
          TAG_SHA=${GITHUB_SHA}
          NS=${IMAGE_NAMESPACE}
          SERVICES="config-server eureka-server product-service order-service api-gateway"
          for svc in $SERVICES; do
            docker build \
              -f services/$svc/Dockerfile \
              -t $NS/$svc:latest \
              -t $NS/$svc:$TAG_SHA \
              .
            docker push $NS/$svc:$TAG_SHA
            docker push $NS/$svc:latest
          done

      - name: Fail if namespace missing
        if: ${{ env.IMAGE_NAMESPACE == '' }}
        run: |
          echo "IMAGE_NAMESPACE not set; please define DOCKERHUB_USERNAME secret." >&2
          exit 1

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.KUBE_CONFIG != '' }}
    concurrency:
      group: cd-deploy-${{ github.ref }}
      cancel-in-progress: true
    env:
      IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG }}
      K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_DATA}" | base64 -d > ~/.kube/config
          echo "Using namespace: ${K8S_NAMESPACE:-default}"

      - name: Apply kustomize base
        run: |
          kubectl apply -k k8s/base -n ${K8S_NAMESPACE:-default}

      - name: Update deployments to built images
        run: |
          NS=${K8S_NAMESPACE:-default}
          TAG=${IMAGE_TAG}
          REPO=${IMAGE_NAMESPACE}
          for svc in config-server eureka-server product-service order-service api-gateway; do
            kubectl -n $NS set image deployment/$svc $svc=$REPO/$svc:$TAG --record
          done

      - name: Rollout status
        run: |
          NS=${K8S_NAMESPACE:-default}
          for svc in config-server eureka-server product-service order-service api-gateway; do
            kubectl -n $NS rollout status deployment/$svc --timeout=120s
          done
