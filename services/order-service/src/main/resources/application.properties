spring.application.name=order-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}

server.port=${SERVER_PORT:8082}

eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}

management.endpoints.web.exposure.include=health,info

# Local fallback config for dev/tests without config server
spring.datasource.url=jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

feign.client.config.default.connect-timeout=2000
feign.client.config.default.read-timeout=3000
feign.circuitbreaker.enabled=true
