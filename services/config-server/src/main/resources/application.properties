server.port=8888
spring.application.name=config-server
spring.profiles.active=native
# Use absolute path in container; works locally too.
spring.cloud.config.server.native.search-locations=file:/app/config-repo,file:./config-repo,file:../config-repo,file:../../config-repo
# Avoid healthcheck failing due to self-calls while the server is starting.
management.health.configserver.enabled=false
# Disable config client behavior inside the config-server itself
spring.cloud.config.enabled=false
